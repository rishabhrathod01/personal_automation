# Meal plan WhatsApp: send lunch/dinner instructions to 565A Cook group
# Schedule: 7:30 AM IST and 5:30 PM IST, Monday–Saturday
# Uses Whapi Sandbox channel (BLKWID-UTZ9U). Set token in GitHub Secrets as WHAPI_API_TOKEN.
name: Meal plan WhatsApp

on:
  # schedule:
  #   # 7:30 AM IST = 02:00 UTC; 5:30 PM IST = 12:00 UTC; Mon–Sat (1–6)
  #   - cron: '0 2 * * 1-6'
  #   - cron: '0 12 * * 1-6'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Send Day 1 lunch/dinner meal plan (by current time) as test'
        required: false
        default: false
        type: boolean

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and build
        run: npm ci && npm run build

      - name: Send meal plan message
        env:
          WHAPI_API_TOKEN: ${{ secrets.WHAPI_API_TOKEN }}
          WHAPI_GROUP_ID: ${{ secrets.WHAPI_GROUP_ID }}
          MEAL_PLAN_COOK_PHONE: ${{ secrets.MEAL_PLAN_COOK_PHONE }}
          MEAL_PLAN_DOC_ID: ${{ secrets.MEAL_PLAN_DOC_ID }}
          MEAL_PLAN_TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && (inputs.test_mode == true || inputs.test_mode == 'true') && 'true' || '' }}
        run: node dist/scripts/meal-plan/send-meal-plan-message.js
